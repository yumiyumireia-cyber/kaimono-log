*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  background-image:linear-gradient(180deg, var(--ground-2) 0%, var(--ground) 220px);
  background-repeat:no-repeat;
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  font-size:18.5px;
  line-height:1.8;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
svg{flex:none}

.wrap{max-width:640px;margin:0 auto;padding:0 16px 110px}

/* ---- top ---- */
.topbar{max-width:640px;margin:0 auto;padding:16px 16px 0;display:flex;flex-direction:column;gap:6px}

.mark{width:clamp(92px, 28vw, 132px);height:auto;flex:none}
.addrow{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:-4px;flex-wrap:wrap}
.brand{flex:1;min-width:0}
.brand h1{
  margin:0;font-size:29px;font-weight:700;letter-spacing:.02em;
  color:var(--navy);line-height:1.25;
}
.brand .sub{
  display:block;font-size:13.5px;font-weight:500;letter-spacing:.22em;
  color:var(--blue);opacity:.85;
}
.btn-add{
  border:none;border-radius:999px;
  background:linear-gradient(180deg, var(--blue), var(--blue-deep));
  color:var(--on-blue);
  padding:14px 24px;font-weight:700;font-size:17px;
  display:inline-flex;align-items:center;gap:7px;
  box-shadow:var(--shadow-lift);
}
.btn-add:hover{filter:brightness(1.06)}
.btn-add:active{transform:translateY(1px)}

/* ---- tools ---- */
.tools{display:flex;flex-direction:column;gap:12px;padding:16px 0 2px}
.searchbox{position:relative;width:100%}
.sortrow{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:2px}
.offline{
  display:none;align-items:center;gap:8px;margin-right:auto;
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;font-size:14.5px;font-weight:700;color:var(--ink-soft);
  box-shadow:var(--shadow);
}
.offline.show{display:inline-flex}
.offline .dot{width:9px;height:9px;border-radius:50%;background:var(--orange);flex:none}
.sortrow .lb{font-size:15px;font-weight:700;letter-spacing:.1em;color:var(--ink-faint)}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--blue);pointer-events:none}
.search{
  width:100%;border:1px solid var(--line-soft);border-radius:var(--r-inner);
  background:var(--card);padding:15px 14px 15px 48px;font-size:18px;
  box-shadow:var(--shadow);
}
.search::placeholder{color:var(--ink-faint)}
.sort{
  border:1px solid var(--line-soft);border-radius:var(--r-inner);
  background:var(--card);padding:12px 12px;font-size:17px;font-weight:500;
  box-shadow:var(--shadow);
}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tab{
  border:1px solid var(--line-soft);background:var(--card);
  color:var(--ink-soft);border-radius:var(--r-inner);
  padding:14px 10px;font-weight:700;font-size:18px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:var(--shadow);
}
.tab .n{font-weight:700;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.tab svg{color:var(--ink-faint)}
.tab[aria-selected="true"]{background:var(--blue-tint);border-color:var(--blue);color:var(--navy)}
.tab[aria-selected="true"] svg{color:var(--blue)}
.tab[aria-selected="true"] .n{color:var(--blue)}
.tab-again[aria-selected="true"]{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-ink)}
.tab-again[aria-selected="true"] svg{color:var(--coral);fill:var(--coral)}
.tab-again[aria-selected="true"] .n{color:var(--coral-ink)}

.filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filter-label{
  width:100%;font-size:15px;font-weight:700;letter-spacing:.1em;
  color:var(--ink-faint);margin-top:2px;
}
.chip{
  border:1px solid var(--line-soft);background:var(--card);
  color:var(--ink-soft);border-radius:999px;
  padding:11px 18px;font-size:17px;font-weight:500;line-height:1.5;
  box-shadow:var(--shadow);
}
.chip[aria-pressed="true"]{
  background:linear-gradient(180deg, var(--blue), var(--blue-deep));
  border-color:var(--blue-deep);color:var(--on-blue);font-weight:700;
}

/* ---- list ---- */
.list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.card{
  background:var(--card);border:1px solid var(--line-soft);
  border-radius:var(--r-card);box-shadow:var(--shadow);
  overflow:hidden;
}
.card.is-again{border-color:var(--coral)}
.cardtop{display:grid;grid-template-columns:92px 1fr;gap:13px;padding:13px}
.thumb-btn{
  padding:0;border:none;background:none;border-radius:var(--r-inner);
  width:92px;height:92px;position:relative;
}
.thumb{
  width:100%;height:100%;border-radius:var(--r-inner);
  background:var(--card-soft);border:1px solid var(--line-soft);
  object-fit:cover;display:block;
}
.thumb-none{display:grid;place-items:center}
.zoom{
  position:absolute;right:5px;bottom:5px;
  width:24px;height:24px;border-radius:50%;
  background:rgba(15,45,80,.62);color:#fff;
  display:grid;place-items:center;
}
.cardmain{
  min-width:0;text-align:left;background:none;border:none;padding:0;
  display:block;width:100%;
}
.name{font-weight:700;font-size:21px;line-height:1.45;margin:0 0 5px;color:var(--navy);word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:5px 6px;margin-bottom:5px}
.tag{
  font-size:15px;line-height:1.7;padding:3px 13px;border-radius:999px;
  background:var(--card-soft);color:var(--ink-soft);
}
.tag.store{background:var(--blue-tint);color:var(--navy);font-weight:500}
.numbers{display:flex;gap:14px;flex-wrap:wrap;font-size:17.5px;color:var(--ink-soft)}
.price{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.memo{margin:7px 0 0;font-size:16.5px;color:var(--ink-soft);white-space:pre-wrap;word-break:break-word}
.cardfoot{display:flex;align-items:center;gap:8px;padding:0 13px 13px}
.again-btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  border-radius:999px;padding:12px 20px;font-size:17px;font-weight:700;
  display:inline-flex;align-items:center;gap:8px;
}
.again-btn svg{fill:none;stroke:currentColor;stroke-width:2}
.again-btn[aria-pressed="true"]{
  background:var(--coral-soft);border-color:var(--coral);color:var(--coral-ink);
}
.again-btn[aria-pressed="true"] svg{fill:var(--coral);stroke:var(--coral)}
.date{margin-left:auto;font-size:15px;color:var(--ink-faint);font-variant-numeric:tabular-nums}

.empty{
  background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);
  padding:14px;margin-top:16px;
}
.empty-in{
  border:2px dashed var(--line);border-radius:var(--r-inner);
  padding:30px 20px 34px;text-align:center;
}
.empty .ch{width:196px;max-width:80%;height:auto;margin:0 auto 2px;display:block}
.empty .big{font-size:24px;font-weight:700;color:var(--navy);margin:6px 0 6px}
.empty p{margin:0;color:var(--ink-soft);font-size:17.5px;line-height:1.85}

/* ---- storage ---- */
.panel{
  background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);
  margin-top:18px;overflow:hidden;
}
.prow{display:flex;align-items:center;gap:13px;padding:14px 16px}
.icirc{
  width:44px;height:44px;border-radius:50%;flex:none;
  background:var(--blue-tint);color:var(--blue);
  display:grid;place-items:center;
}
.prow .t{font-weight:700;font-size:17px;color:var(--navy);line-height:1.5}
.prow .s{font-size:15px;color:var(--ink-faint);line-height:1.6}
.bar{height:7px;border-radius:4px;background:var(--card-soft);overflow:hidden;margin:5px 0 0}
.bar span{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .3s}
.bar.warn span{background:var(--orange)}
.panel details{border-top:1px solid var(--line-soft)}
.panel summary{list-style:none;cursor:pointer}
.panel summary::-webkit-details-marker{display:none}
.chev{margin-left:auto;color:var(--ink-faint);transition:transform .2s}
.panel details[open] .chev{transform:rotate(90deg)}
.iobox{padding:0 16px 16px}
.iobox textarea{
  width:100%;height:96px;padding:10px;
  border:1px solid var(--line);border-radius:12px;background:var(--card-soft);
  font-family:ui-monospace,monospace;font-size:11.5px;line-height:1.5;
}
.mini{
  border:1px solid var(--line);background:var(--card-soft);color:var(--ink);
  border-radius:999px;padding:11px 18px;font-size:16.5px;font-weight:500;
  margin:0 8px 8px 0;
}
.hint{font-size:15.5px;color:var(--ink-faint);line-height:1.7}

/* ---- dialog ---- */
dialog{border:none;padding:0;background:transparent;color:var(--ink);width:100%;max-width:520px;margin:auto}
dialog::backdrop{background:rgba(8,26,45,.55);backdrop-filter:blur(3px)}
.sheet{
  background:var(--card);border-radius:var(--r-card);
  box-shadow:var(--shadow-lift);max-height:90vh;overflow-y:auto;
}
.sheet-head{
  position:sticky;top:0;background:var(--card);z-index:2;
  display:flex;align-items:center;gap:10px;
  padding:18px 18px 12px;border-bottom:1px solid var(--line-soft);
}
.sheet-head h2{font-size:22.5px;font-weight:700;margin:0;flex:1;color:var(--navy)}
.x{
  border:none;background:var(--card-soft);border-radius:50%;
  width:42px;height:42px;color:var(--ink-soft);
  display:grid;place-items:center;flex:none;
}
.form{padding:18px 18px 22px;display:flex;flex-direction:column;gap:17px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:16px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em}
.field input[type="text"],.field input[type="number"],.field textarea{
  border:1px solid var(--line);border-radius:14px;background:var(--card-soft);
  padding:15px 15px;width:100%;font-size:18.5px;
}
.field textarea{min-height:74px;resize:vertical}
.field input[type="file"]{
  border:1px solid var(--line);border-radius:14px;background:var(--card-soft);
  padding:11px 12px;width:100%;font-size:15px;
}
.field input[type="file"]::file-selector-button{
  border:none;border-radius:999px;background:var(--blue-tint);
  color:var(--blue);padding:10px 17px;margin-right:11px;
  font-size:15.5px;font-weight:700;cursor:pointer;
}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo-area{display:flex;gap:13px;align-items:flex-start}
.photo-prev{
  width:112px;height:112px;flex:none;padding:0;position:relative;
  border-radius:var(--r-inner);border:1px solid var(--line);
  background:var(--card-soft);color:var(--ink-faint);
  display:grid;place-items:center;font-size:15.5px;overflow:hidden;
}
.photo-prev img{width:100%;height:100%;object-fit:cover;display:block}
.photo-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.pickbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  border:1px solid var(--blue);background:var(--blue-tint);color:var(--blue);
  border-radius:999px;padding:15px 18px;font-size:17.5px;font-weight:700;cursor:pointer;
}
.pickbtn:hover{filter:brightness(.98)}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.again-field{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line);border-radius:var(--r-inner);
  padding:12px 14px;background:var(--card-soft);
}
.again-field.on{background:var(--coral-soft);border-color:var(--coral)}
.again-field .t{font-weight:700;font-size:18.5px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.again-field .t svg{fill:none;stroke:currentColor;stroke-width:2;color:var(--ink-faint)}
.again-field.on .t{color:var(--coral-ink)}
.again-field.on .t svg{fill:var(--coral);stroke:var(--coral)}
.again-field .s{font-size:15px;color:var(--ink-faint)}
.again-field.on .s{color:var(--coral-ink);opacity:.9}
.switch{
  width:54px;height:31px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);position:relative;flex:none;padding:0;
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;
  border-radius:50%;background:var(--ink-faint);transition:transform .18s,background .18s;
}
.switch[aria-checked="true"]{background:var(--coral);border-color:var(--coral)}
.switch[aria-checked="true"]::after{transform:translateX(23px);background:#fff}
.actions{display:flex;gap:10px;align-items:center;padding-top:2px}
.btn-save{
  flex:1;border:none;border-radius:999px;
  background:linear-gradient(180deg, var(--blue), var(--blue-deep));
  color:var(--on-blue);padding:17px;font-weight:700;font-size:19.5px;
  box-shadow:var(--shadow);
}
.btn-del{
  border:1px solid var(--line);background:var(--card);color:var(--danger);
  border-radius:999px;padding:17px 18px;font-size:17.5px;font-weight:700;
}
.err{color:var(--danger);font-size:16.5px;margin:0;font-weight:700}

/* ---- lightbox ---- */
#lb{max-width:none;width:100%;height:100%;max-height:100%}
#lb::backdrop{background:rgba(6,18,32,.92);backdrop-filter:none}
.lb-in{
  width:100%;height:100%;display:grid;place-items:center;
  padding:16px;background:none;border:none;
}
.lb-in img{max-width:100%;max-height:88vh;border-radius:14px;display:block}
.lb-close{
  position:fixed;top:max(14px, env(safe-area-inset-top));right:14px;
  width:44px;height:44px;border-radius:50%;border:none;
  background:rgba(255,255,255,.92);color:#12324F;
  display:grid;place-items:center;
}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){
  .cardtop{grid-template-columns:80px 1fr;gap:11px}
  .thumb-btn{width:80px;height:80px}
  .brand h1{font-size:24px}
}
</style>

        <label class="mini" for="impFile" style="display:inline-block">ファイルから読み込む</label>
        <input type="file" id="impFile" accept="application/json,.json" class="vh">
        <p class="hint">写真ごと1つのファイルに書き出します。別の端末に移すときや、念のための控えに。<br>読み込むと、今のデータは置き換わります。</p>
      </div>
    </details>
  </div>
</div>

<dialog id="dlg">
  <form class="sheet" id="form" method="dialog">
    <div class="sheet-head">
      <h2 id="dlgTitle">買ったものを追加</h2>
      <button type="button" class="x" id="closeBtn" aria-label="閉じる">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="form">
      <div class="field">
        <label>写真</label>
        <div class="photo-area">
          <button type="button" class="photo-prev" id="prevBox" aria-label="写真を拡大">なし</button>
          <div class="photo-side">
            <label class="pickbtn" for="photo">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5h3.4l1.5-2.3h8.2l1.5 2.3H21v10.2H3Z"/><circle cx="12" cy="13.4" r="3.6"/></svg>
              写真を選ぶ
            </label>
            <input type="file" id="photo" accept="image/*" class="vh">
            <button type="button" class="mini" id="rmPhoto" style="margin:0">写真を外す</button>
          </div>
        </div>
        <p class="hint" id="photoHint">自動で小さく圧縮して保存します。</p>
      </div>

      <div class="field">
        <label for="fName">名前 <span style="color:var(--danger)">*</span></label>
        <input type="text" id="fName" required placeholder="レース糸 40番">
      </div>

      <div class="row2">
        <div class="field">
          <label for="fStore">店</label>
          <input type="text" id="fStore" list="storeList" placeholder="ユザワヤ">
          <datalist id="storeList"></datalist>
        </div>
        <div class="field">
          <label for="fCat">カテゴリ</label>
          <input type="text" id="fCat" list="catList" placeholder="糸">
          <datalist id="catList"></datalist>
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label for="fPrice">値段（円）</label>
          <input type="number" id="fPrice" inputmode="numeric" min="0" placeholder="380">
        </div>
        <div class="field">
          <label for="fSize">サイズ・量</label>
          <input type="text" id="fSize" placeholder="50g玉">
        </div>
      </div>

      <div class="field">
        <label for="fMemo">メモ</label>
        <textarea id="fMemo" placeholder="手ざわりが良かった。色味は写真より黄み。"></textarea>
      </div>

      <div class="again-field" id="againField">
        <div>
          <div class="t">
            <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.6 4.2 12.8a4.9 4.9 0 0 1 6.9-6.9l.9.9.9-.9a4.9 4.9 0 0 1 6.9 6.9Z" stroke-linejoin="round"/></svg>
            また買う
          </div>
          <div class="s">使ってみて良かったら付ける</div>
        </div>
        <button type="button" class="switch" id="fAgain" role="switch" aria-checked="false" aria-label="また買う"></button>
      </div>

      <p class="err" id="err" hidden></p>

      <div class="actions">
        <button type="button" class="btn-del" id="delBtn" hidden>削除</button>
        <button type="button" class="btn-save" id="saveBtn">保存する</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="lb" aria-label="写真の拡大">
  <div class="lb-in" id="lbIn">
    <img id="lbImg" alt="登録した写真">
    <button type="button" class="lb-close" id="lbClose" aria-label="閉じる">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
</dialog>

<script>
(function(){
  "use strict";
  var KEY = "kaimono-again-v1";
  var items = [];
  var editingId = null;
  var pendingBlob = null;      // 新しく選んだ写真（未保存）
  var pendingPhotoId = null;   // すでに保存済みの写真ID
  var urlCache = {};           // 写真ID -> 表示用URL
  var view = { tab:"all", store:null, cat:null, q:"", sort:"new" };

  var $ = function(id){ return document.getElementById(id); };

  var ART = document.querySelector(".mark").src;

  var ICON = {
    basket: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h18l-1.6 10.2A2.5 2.5 0 0 1 17 20.3H7A2.5 2.5 0 0 1 4.6 18.2Z"/><path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8"/></svg>',
    heart: '<svg width="18" height="18" viewBox="0 0 24 24" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.6 4.2 12.8a4.9 4.9 0 0 1 6.9-6.9l.9.9.9-.9a4.9 4.9 0 0 1 6.9 6.9Z"/></svg>',
    zoom: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.3-3.3M11 8.4v5.2M8.4 11h5.2"/></svg>',
    character: '<img class="ch" src="' + ART + '" alt="">'
  };

  /* ---------- 写真の保管庫（IndexedDB） ---------- */
  var DB = null;
  function idb(){
    return new Promise(function(res, rej){
      if (DB) return res(DB);
      if (!window.indexedDB) return rej(new Error("no-idb"));
      var done = false;
      // 応答が返らない環境でも固まらないように保険をかける
      var timer = setTimeout(function(){
        if (!done){ done = true; rej(new Error("idb-timeout")); }
      }, 8000);
      var r;
      try{ r = indexedDB.open("kaimono", 1); }
      catch(e){ clearTimeout(timer); return rej(e); }
      r.onupgradeneeded = function(){
        var d = r.result;
        if (!d.objectStoreNames.contains("photos")) d.createObjectStore("photos");
      };
      r.onsuccess = function(){
        if (done) { r.result.close(); return; }
        done = true; clearTimeout(timer); DB = r.result; res(DB);
      };
      r.onerror = function(){
        if (done) return;
        done = true; clearTimeout(timer); rej(r.error || new Error("idb-error"));
      };
      r.onblocked = function(){
        if (done) return;
        done = true; clearTimeout(timer); rej(new Error("idb-blocked"));
      };
    });
  }
  function putPhoto(id, blob){
    return idb().then(function(d){
      return new Promise(function(res, rej){
        var t = d.transaction("photos", "readwrite");
        t.objectStore("photos").put(blob, id);
        t.oncomplete = function(){ res(id); };
        t.onerror = function(){ rej(t.error); };
      });
    });
  }
  function getPhoto(id){
    if (!id) return Promise.resolve(null);
    return idb().then(function(d){
      return new Promise(function(res, rej){
        var q = d.transaction("photos", "readonly").objectStore("photos").get(id);
        q.onsuccess = function(){ res(q.result || null); };
        q.onerror = function(){ rej(q.error); };
      });
    });
  }
  function delPhoto(id){
    if (!id) return Promise.resolve();
    if (urlCache[id]) { URL.revokeObjectURL(urlCache[id]); delete urlCache[id]; }
    return idb().then(function(d){
      return new Promise(function(res){
        var t = d.transaction("photos", "readwrite");
        t.objectStore("photos").delete(id);
        t.oncomplete = res; t.onerror = res;
      });
    });
  }
  function photoURL(id){
    if (!id) return Promise.resolve(null);
    if (urlCache[id]) return Promise.resolve(urlCache[id]);
    return getPhoto(id).then(function(b){
      if (!b) return null;
      urlCache[id] = URL.createObjectURL(b);
      return urlCache[id];
    }).catch(function(){ return null; });
  }

  /* ---------- メモ本体（localStorage） ---------- */
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      items = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(items)) items = [];
    }catch(e){ items = []; }
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify(items));
      return true;
    }catch(e){
      alert("保存できませんでした。ブラウザの空き容量が足りないようです。\n古いものをいくつか削除してみてください。");
      return false;
    }
  }

  /* 前の版（写真を文字にして保存していた）から引っ越す */
  function migratePhotos(){
    var olds = items.filter(function(i){ return i.photo; });
    if (!olds.length) return Promise.resolve(false);
    return Promise.all(olds.map(function(it){
      return fetch(it.photo).then(function(r){ return r.blob(); }).then(function(b){
        var id = "p" + uid();
        return putPhoto(id, b).then(function(){ it.photoId = id; delete it.photo; });
      }).catch(function(){ delete it.photo; });
    })).then(function(){ save(); return true; });
  }

  /* ---------- 小道具 ---------- */
  function uid(){ return Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
  function yen(n){ return "¥" + Number(n).toLocaleString("ja-JP"); }
  function fmtDate(ts){ var d = new Date(ts); return (d.getMonth()+1) + "/" + d.getDate(); }
  function stamp(){
    var d = new Date(), p = function(n){ return (n<10?"0":"") + n; };
    return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate());
  }
  function fmtBytes(b){
    if (b >= 1073741824) return (b/1073741824).toFixed(1) + " GB";
    if (b >= 1048576) return (b/1048576).toFixed(1) + " MB";
    return Math.round(b/1024) + " KB";
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function uniq(key){
    var seen = {}, out = [];
    items.forEach(function(it){
      var v = (it[key] || "").trim();
      if (v && !seen[v]){ seen[v] = 1; out.push(v); }
    });
    return out.sort(function(a,b){ return a.localeCompare(b, "ja"); });
  }
  function blobToDataURL(b){
    return new Promise(function(res){
      var fr = new FileReader();
      fr.onload = function(){ res(fr.result); };
      fr.onerror = function(){ res(null); };
      fr.readAsDataURL(b);
    });
  }

  /* ---------- 写真を拡大 ---------- */
  function openLightboxById(id){
    photoURL(id).then(function(u){
      if (!u) return;
      $("lbImg").src = u;
      $("lb").showModal();
    });
  }
  $("lbClose").addEventListener("click", function(){ $("lb").close(); });
  $("lbIn").addEventListener("click", function(e){ if (e.target.id !== "lbImg") $("lb").close(); });
  $("lbImg").addEventListener("click", function(){ $("lb").close(); });

  /* ---------- 写真を小さくする ---------- */
  function shrink(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var max = 1400;
        var w = img.naturalWidth, h = img.naturalHeight;
        var s = Math.min(1, max / Math.max(w, h));
        var cv = document.createElement("canvas");
        cv.width = Math.round(w * s);
        cv.height = Math.round(h * s);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        cv.toBlob(function(b){ b ? resolve(b) : reject(new Error("変換できません")); }, "image/jpeg", 0.72);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("読み込めません")); };
      img.src = url;
    });
  }

  /* ---------- 一覧 ---------- */
  function filtered(){
    var q = view.q.trim().toLowerCase();
    var out = items.filter(function(it){
      if (view.tab === "again" && !it.again) return false;
      if (view.store && (it.store || "").trim() !== view.store) return false;
      if (view.cat && (it.cat || "").trim() !== view.cat) return false;
      if (q){
        var hay = ((it.name||"") + " " + (it.memo||"") + " " + (it.store||"") + " " + (it.cat||"") + " " + (it.size||"")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    out.sort(function(a,b){
      if (view.sort === "new") return b.createdAt - a.createdAt;
      if (view.sort === "old") return a.createdAt - b.createdAt;
      var pa = (a.price === null || a.price === undefined) ? -1 : a.price;
      var pb = (b.price === null || b.price === undefined) ? -1 : b.price;
      return view.sort === "high" ? pb - pa : pa - pb;
    });
    return out;
  }

  function chipRow(el, label, values, current, onPick){
    if (!values.length){ el.innerHTML = ""; return; }
    var html = '<span class="filter-label">' + label + '</span>';
    html += '<button class="chip" data-v="" aria-pressed="' + (current === null) + '">すべて</button>';
    values.forEach(function(v){
      html += '<button class="chip" data-v="' + esc(v) + '" aria-pressed="' + (current === v) + '">' + esc(v) + '</button>';
    });
    el.innerHTML = html;
    Array.prototype.forEach.call(el.querySelectorAll(".chip"), function(b){
      b.addEventListener("click", function(){ onPick(b.dataset.v || null); });
    });
  }

  function render(){
    $("nAll").textContent = items.length;
    $("nAgain").textContent = items.filter(function(i){ return i.again; }).length;
    $("tabAll").setAttribute("aria-selected", view.tab === "all");
    $("tabAgain").setAttribute("aria-selected", view.tab === "again");

    chipRow($("storeFilter"), "店", uniq("store"), view.store, function(v){ view.store = v; render(); });
    chipRow($("catFilter"), "カテゴリ", uniq("cat"), view.cat, function(v){ view.cat = v; render(); });

    var rows = filtered();
    var list = $("list");

    if (!rows.length){
      list.innerHTML = '<div class="empty"><div class="empty-in">' + ICON.character +
        (items.length === 0
          ? '<p class="big">まだ何もありません</p><p>右上の『＋ 追加』から、<br>買ったものを登録できます。</p>'
          : '<p class="big">見つかりませんでした</p><p>絞り込みを「すべて」に<br>戻してみてください。</p>') +
        '</div></div>';
    } else {
      list.innerHTML = rows.map(function(it){
        var thumb;
        if (it.photoId){
          var cached = urlCache[it.photoId];
          thumb = '<img class="thumb" data-pid="' + it.photoId + '"' + (cached ? ' src="' + cached + '"' : '') +
                  ' alt="' + esc(it.name) + 'の写真"><span class="zoom">' + ICON.zoom + '</span>';
        } else {
          thumb = '<div class="thumb thumb-none">' + ICON.basket + '</div>';
        }
        var tags = "";
        if (it.store) tags += '<span class="tag store">' + esc(it.store) + '</span>';
        if (it.cat) tags += '<span class="tag">' + esc(it.cat) + '</span>';
        var nums = "";
        if (it.price !== null && it.price !== undefined && it.price !== "") nums += '<span class="price">' + yen(it.price) + '</span>';
        if (it.size) nums += '<span>' + esc(it.size) + '</span>';
        return '<article class="card' + (it.again ? " is-again" : "") + '">' +
          '<div class="cardtop">' +
            '<button class="thumb-btn" data-zoom="' + it.id + '"' + (it.photoId ? ' aria-label="写真を拡大"' : ' aria-hidden="true" tabindex="-1"') + '>' + thumb + '</button>' +
            '<button class="cardmain" data-edit="' + it.id + '">' +
              '<h3 class="name">' + esc(it.name) + '</h3>' +
              (tags ? '<div class="meta">' + tags + '</div>' : "") +
              (nums ? '<div class="numbers">' + nums + '</div>' : "") +
              (it.memo ? '<p class="memo">' + esc(it.memo) + '</p>' : "") +
            '</button>' +
          '</div>' +
          '<div class="cardfoot">' +
            '<button class="again-btn" data-again="' + it.id + '" aria-pressed="' + !!it.again + '">' +
              ICON.heart + 'また買う</button>' +
            '<span class="date">' + fmtDate(it.createdAt) + '</span>' +
          '</div>' +
        '</article>';
      }).join("");

      Array.prototype.forEach.call(list.querySelectorAll("img[data-pid]:not([src])"), function(img){
        photoURL(img.dataset.pid).then(function(u){ if (u) img.src = u; });
      });
    }

    Array.prototype.forEach.call(list.querySelectorAll("[data-edit]"), function(b){
      b.addEventListener("click", function(){ openDialog(b.dataset.edit); });
    });
    Array.prototype.forEach.call(list.querySelectorAll("[data-zoom]"), function(b){
      b.addEventListener("click", function(){
        var it = items.filter(function(x){ return x.id === b.dataset.zoom; })[0];
        if (it && it.photoId) openLightboxById(it.photoId);
        else if (it) openDialog(it.id);
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll("[data-again]"), function(b){
      b.addEventListener("click", function(){
        var it = items.filter(function(x){ return x.id === b.dataset.again; })[0];
        if (!it) return;
        it.again = !it.again;
        it.updatedAt = Date.now();
        if (save()) render();
      });
    });

    updateUsage();
    $("storeList").innerHTML = uniq("store").map(function(v){ return '<option value="' + esc(v) + '">'; }).join("");
    $("catList").innerHTML = uniq("cat").map(function(v){ return '<option value="' + esc(v) + '">'; }).join("");
  }

  /* ---------- 保存容量 ---------- */
  function updateUsage(){
    var bar = $("bar");
    if (navigator.storage && navigator.storage.estimate){
      navigator.storage.estimate().then(function(e){
        var used = e.usage || 0, quota = e.quota || 0;
        $("useTxt").textContent = fmtBytes(used) + (quota ? "　あと約 " + fmtBytes(Math.max(0, quota - used)) : "");
        var pct = quota ? (used / quota * 100) : 0;
        bar.classList.toggle("warn", pct > 70);
        bar.firstElementChild.style.width = Math.max(1, Math.min(100, pct)) + "%";
      }).catch(function(){ $("useTxt").textContent = ""; });
    } else {
      var b = 0;
      try{ b = new Blob([localStorage.getItem(KEY) || ""]).size; }catch(e){}
      $("useTxt").textContent = fmtBytes(b);
      bar.firstElementChild.style.width = "1%";
    }
  }

  /* ---------- 追加・編集 ---------- */
  function setPhotoPreview(url){
    var box = $("prevBox");
    if (url){
      box.innerHTML = '<img src="' + url + '" alt="選んだ写真">';
      box.setAttribute("aria-label", "写真を拡大");
      $("photoHint").textContent = "写真をタップすると大きく見られます。";
    } else {
      box.textContent = "なし";
      box.removeAttribute("aria-label");
      $("photoHint").textContent = "自動で小さく圧縮して保存します。";
    }
  }
  function setAgain(on){
    $("fAgain").setAttribute("aria-checked", on ? "true" : "false");
    $("againField").classList.toggle("on", !!on);
  }

  function openDialog(id){
    editingId = id || null;
    var it = id ? items.filter(function(x){ return x.id === id; })[0] : null;
    $("dlgTitle").textContent = it ? "買ったものを編集" : "買ったものを追加";
    $("fName").value = it ? it.name : "";
    $("fStore").value = it ? (it.store || "") : "";
    $("fCat").value = it ? (it.cat || "") : "";
    $("fPrice").value = (it && it.price !== null && it.price !== undefined) ? it.price : "";
    $("fSize").value = it ? (it.size || "") : "";
    $("fMemo").value = it ? (it.memo || "") : "";
    setAgain(it ? it.again : false);
    pendingBlob = null;
    pendingPhotoId = it ? (it.photoId || null) : null;
    setPhotoPreview(null);
    if (pendingPhotoId) photoURL(pendingPhotoId).then(function(u){ if (u) setPhotoPreview(u); });
    $("photo").value = "";
    $("delBtn").hidden = !it;
    $("err").hidden = true;
    $("saveBtn").disabled = false;
    $("saveBtn").textContent = "保存する";
    $("dlg").showModal();
    if (!it) setTimeout(function(){ $("fName").focus(); }, 50);
  }

  $("addBtn").addEventListener("click", function(){ openDialog(null); });
  $("closeBtn").addEventListener("click", function(){ $("dlg").close(); });
  $("prevBox").addEventListener("click", function(){
    var img = $("prevBox").querySelector("img");
    if (!img) return;
    $("lbImg").src = img.src;
    $("lb").showModal();
  });

  $("fAgain").addEventListener("click", function(){
    setAgain($("fAgain").getAttribute("aria-checked") !== "true");
  });

  /* 写真の準備中は保存させない（押せてしまうと写真なしで保存されてしまう） */
  function setPhotoBusy(on){
    $("saveBtn").disabled = !!on;
    $("saveBtn").textContent = on ? "写真を準備中…" : "保存する";
    if (on) $("photoHint").textContent = "写真を読み込んでいます…";
  }

  $("photo").addEventListener("change", function(){
    var f = $("photo").files && $("photo").files[0];
    if (!f) return;
    $("err").hidden = true;
    setPhotoBusy(true);
    shrink(f).then(function(blob){
      pendingBlob = blob;
      setPhotoBusy(false);
      setPhotoPreview(URL.createObjectURL(blob));
    }).catch(function(){
      setPhotoBusy(false);
      setPhotoPreview(pendingBlob || pendingPhotoId ? null : null);
      $("err").textContent = "この写真は読み込めませんでした。別の写真を選ぶか、写真なしで保存してください。";
      $("err").hidden = false;
    });
  });

  $("rmPhoto").addEventListener("click", function(){
    pendingBlob = null;
    pendingPhotoId = null;
    $("photo").value = "";
    setPhotoPreview(null);
  });

  $("saveBtn").addEventListener("click", function(){
    var name = $("fName").value.trim();
    if (!name){
      $("err").textContent = "名前を入れてください。";
      $("err").hidden = false;
      $("fName").focus();
      return;
    }
    var btn = $("saveBtn");
    btn.disabled = true;
    btn.textContent = "保存中…";

    var priceRaw = $("fPrice").value.trim();
    var data = {
      name: name,
      store: $("fStore").value.trim(),
      cat: $("fCat").value.trim(),
      price: priceRaw === "" ? null : Number(priceRaw),
      size: $("fSize").value.trim(),
      memo: $("fMemo").value,
      again: $("fAgain").getAttribute("aria-checked") === "true",
      updatedAt: Date.now()
    };
    var old = editingId ? items.filter(function(x){ return x.id === editingId; })[0] : null;
    var oldPid = old ? (old.photoId || null) : null;

    var photoStep;
    if (pendingBlob){
      var newId = "p" + uid();
      photoStep = putPhoto(newId, pendingBlob).then(function(){
        data.photoId = newId;
        if (oldPid) return delPhoto(oldPid);
      });
    } else {
      data.photoId = pendingPhotoId;
      photoStep = (oldPid && !pendingPhotoId) ? delPhoto(oldPid) : Promise.resolve();
    }

    photoStep.then(function(){
      if (editingId){
        items = items.map(function(x){ return x.id === editingId ? Object.assign({}, x, data) : x; });
      } else {
        data.id = uid();
        data.createdAt = Date.now();
        items.unshift(data);
      }
      save();
      $("dlg").close();
      render();
    }).catch(function(e){
      var msg = (e && (e.message === "idb-timeout" || e.message === "no-idb" || e.message === "idb-blocked"))
        ? "この画面では写真を保存できませんでした。プライベートブラウズを使っている場合は、通常の画面で開いてみてください。"
        : "写真を保存できませんでした。空き容量を確認してください。";
      $("err").textContent = msg;
      $("err").hidden = false;
    }).then(function(){ btn.disabled = false; btn.textContent = "保存する"; });
  });

  $("delBtn").addEventListener("click", function(){
    if (!editingId) return;
    if (!confirm("この記録を削除します。よろしいですか？")) return;
    var it = items.filter(function(x){ return x.id === editingId; })[0];
    var pid = it && it.photoId;
    items = items.filter(function(x){ return x.id !== editingId; });
    save();
    $("dlg").close();
    render();
    if (pid) delPhoto(pid);
  });

  /* ---------- 上のボタン類 ---------- */
  $("tabAll").addEventListener("click", function(){ view.tab = "all"; render(); });
  $("tabAgain").addEventListener("click", function(){ view.tab = "again"; render(); });
  $("q").addEventListener("input", function(){ view.q = $("q").value; render(); });
  $("sort").addEventListener("change", function(){ view.sort = $("sort").value; render(); });

  /* ---------- バックアップ（ファイルで出し入れ） ---------- */
  $("expBtn").addEventListener("click", function(){
    var btn = $("expBtn"), label = btn.textContent;
    btn.disabled = true; btn.textContent = "準備中…";
    var photos = {};
    var ids = items.map(function(i){ return i.photoId; }).filter(Boolean);
    Promise.all(ids.map(function(id){
      return getPhoto(id).then(function(b){
        if (!b) return;
        return blobToDataURL(b).then(function(d){ if (d) photos[id] = d; });
      });
    })).then(function(){
      var blob = new Blob([JSON.stringify({ v:2, items: items, photos: photos })], { type:"application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "また買うノート_" + stamp() + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 8000);
    }).catch(function(){
      alert("書き出せませんでした。");
    }).then(function(){
      btn.disabled = false; btn.textContent = label;
    });
  });

  $("impFile").addEventListener("change", function(){
    var f = this.files && this.files[0];
    this.value = "";
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      var data;
      try{ data = JSON.parse(fr.result); }catch(e){ alert("このファイルは読み込めませんでした。"); return; }
      var list = Array.isArray(data) ? data : (data && data.items);
      if (!Array.isArray(list)){ alert("バックアップのファイルではないようです。"); return; }
      if (!confirm("今のデータを、選んだファイルの内容で置き換えます。よろしいですか？")) return;
      var photos = (data && data.photos) || {};
      Promise.all(Object.keys(photos).map(function(id){
        return fetch(photos[id]).then(function(r){ return r.blob(); }).then(function(b){ return putPhoto(id, b); }).catch(function(){});
      })).then(function(){
        items = list;
        return migratePhotos();
      }).then(function(){
        save();
        urlCache = {};
        render();
        alert("読み込みました。");
      }).catch(function(){ alert("読み込みに失敗しました。"); });
    };
    fr.readAsText(f);
  });

  /* ---------- オフライン表示 ---------- */
  function updateOnline(){
    $("offlineBadge").classList.toggle("show", !navigator.onLine);
  }
  window.addEventListener("online", updateOnline);
  window.addEventListener("offline", updateOnline);
  updateOnline();

  load();
  render();
  migratePhotos().then(function(moved){ if (moved) render(); });
})();

/* ---------- 電波が無くても開けるようにする ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* 使えない環境では何もしない */ });
  });
}
</script>
